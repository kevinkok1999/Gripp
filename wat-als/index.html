<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Wat als?</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const c=GRIP.calc();GRIP.shell('/wat-als/','Wat als je iets verandert?','Test een keuze eerst op papier. GRIP laat zien wat die verandering ongeveer met je maandruimte doet.',`<div class="layout2"><section class="panel"><h2>Test een scenario</h2><div class="field"><label>Verandering inkomen per maand</label><div class="input"><span>€</span><input id="inc" type="number" value="0"></div></div><div class="field"><label>Verandering kosten per maand</label><div class="input"><span>€</span><input id="cost" type="number" value="0"></div></div><div class="field"><label>Eenmalige uitgave</label><div class="input"><span>€</span><input id="one" type="number" value="0"></div></div><div class="actions"><button class="btn secondary preset" data-i="-300" data-c="0" data-o="0">Minder werken</button><button class="btn secondary preset" data-i="0" data-c="150" data-o="0">Hogere woonlasten</button><button class="btn secondary preset" data-i="0" data-c="0" data-o="1500">Grote aankoop</button></div></section><aside class="stack"><section class="actionBox"><small>Nieuwe maandruimte</small><h3 id="out">${GRIP.money(c.monthlyFree)}</h3><p id="explain">Pas de bedragen aan om het effect te zien.</p></section><section class="panel"><h3>Gebruik dit als richting</h3><p class="muted">Een scenario is geen voorspelling. Het helpt je vooral betere vragen te stellen vóór je een keuze maakt.</p></section></aside></div>`);const run=()=>{const i=Number(GRIP.q('#inc').value)||0,co=Number(GRIP.q('#cost').value)||0,o=GRIP.num(GRIP.q('#one').value),n=c.monthlyFree+i-co;GRIP.q('#out').textContent=GRIP.money(n);GRIP.q('#explain').textContent='Dat is '+GRIP.money(n-c.monthlyFree)+' verschil per maand. '+(o?('Na een eenmalige uitgave van '+GRIP.money(o)+' houd je die maand ongeveer '+GRIP.money(n-o)+' over.'):'')};['inc','cost','one'].forEach(id=>GRIP.q('#'+id).oninput=run);GRIP.qa('.preset').forEach(b=>b.onclick=()=>{GRIP.q('#inc').value=b.dataset.i;GRIP.q('#cost').value=b.dataset.c;GRIP.q('#one').value=b.dataset.o;run()});</script></body></html>
