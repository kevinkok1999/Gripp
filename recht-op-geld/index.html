<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Recht op geld</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load(),p=d.profile;const items=[];if(p.healthInsured)items.push(['Zorgtoeslag','Mogelijk relevant bij een Nederlandse zorgverzekering. Inkomen en vermogen tellen mee.']);if(p.rentHome)items.push(['Huurtoeslag','Mogelijk relevant als je huurt. Persoonlijke situatie, inkomen, huur en vermogen bepalen de uitkomst.']);if(p.children)items.push(['Kindgebonden budget','Mogelijk relevant bij kinderen onder 18. Inkomen, gezinssituatie en vermogen spelen mee.']);if(p.childcareUse)items.push(['Kinderopvangtoeslag','Mogelijk relevant als je geregistreerde kinderopvang gebruikt en aan de voorwaarden voldoet.']);GRIP.shell('/recht-op-geld/','Waar heb ik mogelijk recht op?','GRIP helpt je niets over het hoofd te zien. Het geeft geen definitieve beschikking, maar laat zien wat je officieel moet controleren.',`<div class="layout2"><section class="panel"><h2>Jouw mogelijke checks</h2><div class="stack">${items.length?items.map(([n,t])=>`<article class="scheme possible"><h3>${n}</h3><p>${t}</p><a href="https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/themaoverstijgend/rekenhulpen/toeslagen/proefberekening_toeslagen" target="_blank" rel="noopener">Open officiële proefberekening →</a></article>`).join(''):'<div class="notice">Vul eerst bij Mijn GRIP in of je huurt, zorgverzekerd bent, kinderen hebt en kinderopvang gebruikt. Daarna wordt deze pagina persoonlijker.</div>'}</div></section><aside class="stack"><section class="actionBox"><small>Belangrijk</small><h3>Controleer altijd officieel</h3><p>GRIP signaleert alleen mogelijkheden. Dienst Toeslagen bepaalt op basis van jouw volledige situatie of je recht hebt en hoeveel.</p></section><section class="panel"><h3>Waarom dit helpt</h3><p class="muted">Veel mensen missen regelingen omdat ze niet weten welke check relevant is. GRIP maakt eerst de shortlist; jij controleert hem bij de officiële bron.</p><a class="btn secondary" href="/mijn-grip/">Pas mijn situatie aan</a></section></aside></div>`);</script></body></html>
