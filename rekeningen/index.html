<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Rekeningen</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load();GRIP.shell('/rekeningen/','Rekeningen die je niet wilt vergeten','Maak van jaarlijkse en onregelmatige uitgaven kleine maandpotjes, zodat een grote rekening minder onverwacht voelt.',`<div class="layout2"><section class="panel"><h2>Nieuwe rekening</h2><p class="muted">Begin met één rekening die je normaal makkelijk vergeet.</p><div class="field"><label>Naam</label><div class="input"><input id="bn" placeholder="Bijv. autoverzekering"></div></div><div class="formGrid"><div class="field"><label>Bedrag</label><div class="input"><span>€</span><input id="ba" type="number"></div></div><div class="field"><label>Betaaldatum</label><div class="input"><input id="bd" type="date"></div></div></div><button class="btn primary" id="add">Rekening toevoegen</button></section><section class="panel"><h2>Jouw rekeningpotjes</h2><div id="rows" class="list"></div></section></div>`);const render=()=>{GRIP.q('#rows').innerHTML=d.bills.length?d.bills.map(b=>`<div class="row"><div><small>${GRIP.esc(b.due||'Geen datum')}</small><b>${GRIP.esc(b.name)}</b><span class="muted">${GRIP.money(b.amount)} · ongeveer ${GRIP.money(GRIP.num(b.amount)/GRIP.monthsUntil(b.due))}/mnd apart</span></div><button class="smallBtn dangerBtn" data-del="${b.id}">Verwijder</button></div>`).join(''):'<div class="notice good">Nog geen rekeningen. Begin met één jaarlijkse rekening; dat is genoeg voor vandaag.</div>';GRIP.qa('[data-del]').forEach(x=>x.onclick=()=>{d.bills=d.bills.filter(b=>b.id!==x.dataset.del);GRIP.save();render()})};GRIP.q('#add').onclick=()=>{const name=GRIP.q('#bn').value.trim(),amount=GRIP.num(GRIP.q('#ba').value),due=GRIP.q('#bd').value;if(!name||!amount)return GRIP.toast('Vul naam en bedrag in');d.bills.push({id:GRIP.uid(),name,amount,due});GRIP.save();render();GRIP.toast('Rekening toegevoegd')};render();</script></body></html>
