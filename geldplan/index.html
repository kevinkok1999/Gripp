<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Geldplan</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load(),p=d.profile,c=GRIP.calc(),avail=GRIP.num(p.currentBalance),essential=Math.min(avail,c.costs),reserve=Math.min(Math.max(0,avail-essential),c.billReserve),goals=Math.min(Math.max(0,avail-essential-reserve),c.goalReserve+GRIP.num(p.monthlySaving)),free=Math.max(0,avail-essential-reserve-goals);GRIP.shell('/geldplan/','Geef je geld een taak','Niet alleen terugkijken, maar bepalen wat het geld dat je nu hebt nog moet doen.',`<div class="layout2"><section class="panel"><span class="pill">Beschikbaar nu</span><div class="big">${GRIP.money(avail)}</div><p class="muted">GRIP verplaatst niets echt op je bankrekening. Dit is een plan dat jij kunt aanpassen.</p><div class="bars">${[['Essentiële maandkosten',essential],['Toekomstige rekeningen',reserve],['Doelen & sparen',goals],['Vrij te besteden',free]].map(([n,v])=>`<div class="barRow"><small>${n}</small><div class="track"><div class="fill" style="width:${avail?Math.min(100,v/avail*100):0}%"></div></div><b>${GRIP.money(v)}</b></div>`).join('')}</div></section><aside class="stack"><section class="actionBox"><small>Wat betekent dit voor mij?</small><h3>${free>0?'Je hebt nog ruimte zonder taak':'Bijna alles heeft al een taak'}</h3><p>${free>0?GRIP.money(free)+' is volgens je huidige invoer nog niet nodig voor basis, potjes of doelen.':'Controleer eerst je komende rekeningen voordat je extra uitgaven plant.'}</p></section><section class="panel"><h3>Waarom GRIP zo rekent</h3><p class="muted">Eerst basisuitgaven, dan bekende toekomstige kosten en doelen. Pas wat daarna overblijft noemen we vrij.</p></section></aside></div>`);</script></body></html>
