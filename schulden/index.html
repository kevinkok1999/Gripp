<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Schulden</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load();GRIP.shell('/schulden/','Schulden zonder oordeel','Krijg overzicht, zie wat minimaal moet en kies één haalbare volgende stap. GRIP is geen kredietverstrekker en moedigt geen nieuwe schuld aan.',`<div class="layout2"><section class="panel"><h2>Voeg een schuld toe</h2><div class="field"><label>Naam</label><div class="input"><input id="dn" placeholder="Bijv. persoonlijke lening"></div></div><div class="formGrid"><div class="field"><label>Openstaand</label><div class="input"><span>€</span><input id="db" type="number"></div></div><div class="field"><label>Minimale betaling per maand</label><div class="input"><span>€</span><input id="dm" type="number"></div></div><div class="field"><label>Rente % (optioneel)</label><div class="input"><input id="dr" type="number" step="0.1"></div></div></div><button class="btn primary" id="add">Toevoegen</button></section><section class="panel"><h2>Overzicht</h2><div id="rows" class="stack"></div></section></div>`);const render=()=>{const total=d.debts.reduce((s,x)=>s+GRIP.num(x.balance),0),mins=d.debts.reduce((s,x)=>s+GRIP.num(x.minimum),0);GRIP.q('#rows').innerHTML=`<div class="notice ${total?'warn':'good'}">${total?'Totaal openstaand '+GRIP.money(total)+' · minimaal '+GRIP.money(mins)+'/mnd. Focus eerst op overzicht en betaalbaarheid.':'Nog geen schulden toegevoegd.'}</div>`+(d.debts.map(x=>`<div class="row"><div><small>${GRIP.num(x.rate)?GRIP.num(x.rate)+'% rente':'Rente niet ingevuld'}</small><b>${GRIP.esc(x.name)}</b><span class="muted">${GRIP.money(x.balance)} open · ${GRIP.money(x.minimum)}/mnd minimaal</span></div><button class="smallBtn dangerBtn" data-del="${x.id}">Verwijder</button></div>`).join(''));GRIP.qa('[data-del]').forEach(b=>b.onclick=()=>{d.debts=d.debts.filter(x=>x.id!==b.dataset.del);GRIP.save();render()})};GRIP.q('#add').onclick=()=>{const name=GRIP.q('#dn').value.trim(),balance=GRIP.num(GRIP.q('#db').value),minimum=GRIP.num(GRIP.q('#dm').value),rate=GRIP.num(GRIP.q('#dr').value);if(!name||!balance)return GRIP.toast('Vul naam en openstaand bedrag in');d.debts.push({id:GRIP.uid(),name,balance,minimum,rate});GRIP.save();render();GRIP.toast('Schuld toegevoegd')};render();</script></body></html>
