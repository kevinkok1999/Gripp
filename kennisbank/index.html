<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Kennisbank</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>GRIP.shell('/kennisbank/','Kennisbank','Geen financieel jargon. Alleen uitleg die je helpt begrijpen wat je ziet en wat je daarna kunt doen.',`<div class="articleGrid"><article class="articleCard"><span class="pill">Beginnen</span><h3>Wat is veilig te besteden?</h3><p>Wat overblijft nadat bekende maandkosten, rekeningpotjes en doelen zijn meegenomen. Het blijft een schatting op basis van wat jij invoert.</p><a class="read" href="/geldplan/">Bekijk mijn geldplan →</a></article><article class="articleCard"><span class="pill">Vooruit</span><h3>Waarom jaarrekeningen maandelijks opdelen?</h3><p>Een rekening van €600 voelt anders als je er zes maanden lang €100 voor reserveert.</p><a class="read" href="/rekeningen/">Maak rekeningpotjes →</a></article><article class="articleCard"><span class="pill">Rust</span><h3>Wat betekent buffer in dagen?</h3><p>GRIP deelt je buffer door je gemiddelde dagelijkse maandkosten. Zo zie je hoeveel dagen financiële ademruimte je ongeveer hebt.</p><a class="read" href="/doelen/">Werk aan mijn buffer →</a></article><article class="articleCard"><span class="pill">Regelingen</span><h3>Hoe werkt Recht op geld?</h3><p>GRIP signaleert welke officiële checks mogelijk relevant zijn. De overheid bepaalt uiteindelijk of je recht hebt en hoeveel.</p><a class="read" href="/recht-op-geld/">Doe de check →</a></article><article class="articleCard"><span class="pill">Keuzes</span><h3>Waarom Wat-als gebruiken?</h3><p>Je ziet eerst het mogelijke effect van minder inkomen, hogere lasten of een grote aankoop, voordat je beslist.</p><a class="read" href="/wat-als/">Test een scenario →</a></article><article class="articleCard"><span class="pill">Schulden</span><h3>Begin met overzicht, niet met schaamte</h3><p>Zet eerst openstaand bedrag en minimale betaling bij elkaar. Daarna kun je rustiger bekijken wat haalbaar is.</p><a class="read" href="/schulden/">Maak overzicht →</a></article></div><div class="helpBand" style="margin-top:18px"><div><b>Een vraag hoeft niet slim geformuleerd te zijn.</b><p>GRIP is bedoeld voor mensen die gewoon willen weten: wat betekent dit voor mij en wat kan ik nu doen?</p></div><a class="btn primary" href="/mijn-grip/">Start bij mijn situatie</a></div>`);</script></body></html>
