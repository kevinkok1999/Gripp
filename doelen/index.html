<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Doelen</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load();GRIP.shell('/doelen/','Maak een groot doel klein','Een doel voelt haalbaarder als je weet wat de eerstvolgende mijlpaal is en wat er per maand nodig is.',`<div class="layout2"><section class="panel"><h2>Nieuw doel</h2><div class="field"><label>Doel</label><div class="input"><input id="gn" placeholder="Bijv. noodbuffer"></div></div><div class="formGrid"><div class="field"><label>Doelbedrag</label><div class="input"><span>€</span><input id="gt" type="number"></div></div><div class="field"><label>Al gespaard</label><div class="input"><span>€</span><input id="gs" type="number"></div></div><div class="field"><label>Gewenste datum</label><div class="input"><input id="gd" type="date"></div></div></div><button class="btn primary" id="add">Doel toevoegen</button></section><section class="panel"><h2>Jouw doelen</h2><div id="rows" class="stack"></div></section></div>`);const render=()=>{GRIP.q('#rows').innerHTML=d.goals.length?d.goals.map(g=>{const left=Math.max(0,GRIP.num(g.target)-GRIP.num(g.saved)),m=GRIP.monthsUntil(g.date),pm=left/m,pct=g.target?Math.min(100,g.saved/g.target*100):0;return`<article class="goalCard"><small class="muted">${GRIP.esc(g.date||'Geen datum')}</small><h3>${GRIP.esc(g.name)}</h3><p>${GRIP.money(g.saved)} van ${GRIP.money(g.target)} · ongeveer ${GRIP.money(pm)}/mnd nodig</p><div class="progress"><span style="width:${pct}%"></span></div><button class="smallBtn dangerBtn" data-del="${g.id}">Verwijder</button></article>`}).join(''):'<div class="notice good">Nog geen doel. Eén klein doel is genoeg om te beginnen.</div>';GRIP.qa('[data-del]').forEach(x=>x.onclick=()=>{d.goals=d.goals.filter(g=>g.id!==x.dataset.del);GRIP.save();render()})};GRIP.q('#add').onclick=()=>{const name=GRIP.q('#gn').value.trim(),target=GRIP.num(GRIP.q('#gt').value),saved=GRIP.num(GRIP.q('#gs').value),date=GRIP.q('#gd').value;if(!name||!target)return GRIP.toast('Vul doel en doelbedrag in');d.goals.push({id:GRIP.uid(),name,target,saved,date});GRIP.save();render();GRIP.toast('Doel toegevoegd')};render();</script></body></html>
