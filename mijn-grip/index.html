<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn GRIP</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const c=GRIP.calc(),a=GRIP.action();GRIP.shell('/mijn-grip/','Mijn GRIP','Vul je situatie rustig stap voor stap in. Daarna werken alle andere pagina’s automatisch met dezelfde gegevens.',`<div class="kpis"><div class="kpi"><small>Inkomen</small><strong>${GRIP.money(c.income)}</strong></div><div class="kpi"><small>Maandkosten</small><strong>${GRIP.money(c.costs)}</strong></div><div class="kpi"><small>Vrije maandruimte</small><strong>${GRIP.money(c.monthlyFree)}</strong></div><div class="kpi"><small>Rustbuffer</small><strong>${Math.round(c.bufferDays)} dagen</strong></div></div><div class="layout2"><section class="panel"><div class="progress"><span id="prog" style="width:25%"></span></div><div class="wizardStep active" data-step="1"><div class="group"><h3>1. Wat is er nu?</h3><p>Begin met geld dat werkelijk beschikbaar is en wat er maandelijks binnenkomt.</p><div class="formGrid"><div class="field"><label>Beschikbaar saldo nu</label><div class="input"><span>€</span><input data-p="currentBalance" type="number"></div></div><div class="field"><label>Mijn netto inkomen</label><div class="input"><span>€</span><input data-p="income1" type="number"></div></div><div class="field"><label>Partner / tweede inkomen</label><div class="input"><span>€</span><input data-p="income2" type="number"></div></div><div class="field"><label>Toeslagen / uitkeringen</label><div class="input"><span>€</span><input data-p="benefits" type="number"></div></div></div></div></div><div class="wizardStep" data-step="2"><div class="group"><h3>2. Wat kost je maand?</h3><p>Een goede schatting is prima. Het hoeft niet op de cent nauwkeurig.</p><div class="formGrid">${[['housing','Huur / hypotheek'],['energy','Energie + water'],['insurance','Verzekeringen'],['telecom','Internet + telefoon'],['groceries','Boodschappen'],['transport','Vervoer'],['subscriptions','Abonnementen'],['debtMinimum','Leningen / aflossingen'],['childcare','Kinderen / opvang'],['otherCosts','Overig']].map(([k,l])=>`<div class="field"><label>${l}</label><div class="input"><span>€</span><input data-p="${k}" type="number"></div></div>`).join('')}</div></div></div><div class="wizardStep" data-step="3"><div class="group"><h3>3. Buffer & plannen</h3><div class="formGrid"><div class="field"><label>Beschikbare buffer</label><div class="input"><span>€</span><input data-p="buffer" type="number"></div></div><div class="field"><label>Extra sparen per maand</label><div class="input"><span>€</span><input data-p="monthlySaving" type="number"></div></div><div class="field"><label>Huishoudgrootte</label><div class="input"><input data-p="householdSize" type="number" min="1"></div></div></div></div></div><div class="wizardStep" data-step="4"><div class="group"><h3>4. Waar kan GRIP extra naar kijken?</h3><p>Dit helpt Recht op geld om gerichter te signaleren wat je officieel moet controleren.</p><div class="checkerGrid"><label class="checkbox"><input data-p="rentHome" type="checkbox"><span><b>Ik huur mijn woning</b><small class="muted">Voor mogelijke huurtoeslag.</small></span></label><label class="checkbox"><input data-p="healthInsured" type="checkbox"><span><b>Nederlandse zorgverzekering</b><small class="muted">Voor mogelijke zorgtoeslag.</small></span></label><label class="checkbox"><input data-p="children" type="checkbox"><span><b>Kind(eren) onder 18</b><small class="muted">Voor kindregelingen.</small></span></label><label class="checkbox"><input data-p="childcareUse" type="checkbox"><span><b>Ik betaal kinderopvang</b><small class="muted">Voor mogelijke kinderopvangtoeslag.</small></span></label></div><div class="formGrid" style="margin-top:12px"><div class="field"><label>Leeftijd</label><div class="input"><input data-p="age" type="number"></div></div><div class="field"><label>Geschat jaarinkomen</label><div class="input"><span>€</span><input data-p="yearlyIncome" type="number"></div></div><div class="field"><label>Vermogen / spaargeld</label><div class="input"><span>€</span><input data-p="assets" type="number"></div></div><div class="field"><label>Gemeente</label><div class="input"><input data-p="municipality" placeholder="Bijv. Dordrecht"></div></div></div></div></div><div class="actions"><button class="btn secondary" id="back">Terug</button><button class="btn primary" id="next">Volgende</button><button class="btn primary" id="finish" style="display:none">Bewaar mijn situatie</button></div></section><aside class="stack"><section class="actionBox"><small>Jouw volgende stap</small><h3>${GRIP.esc(a[0])}</h3><p>${GRIP.esc(a[1])}</p><a class="btn primary" style="margin-top:14px" href="${a[2]}">Help mij hiermee</a></section><section class="panel"><h3>Je hoeft dit niet in één keer af te maken</h3><p class="muted">Later kun je rekeningen, doelen en schulden één voor één toevoegen.</p></section></aside></div>`);GRIP.setProfile();let step=1;const paint=()=>{GRIP.qa('.wizardStep').forEach(x=>x.classList.toggle('active',Number(x.dataset.step)===step));GRIP.q('#prog').style.width=(step*25)+'%';GRIP.q('#back').style.visibility=step===1?'hidden':'visible';GRIP.q('#next').style.display=step===4?'none':'inline-flex';GRIP.q('#finish').style.display=step===4?'inline-flex':'none'};GRIP.q('#next').onclick=()=>{GRIP.readProfile();step=Math.min(4,step+1);paint()};GRIP.q('#back').onclick=()=>{GRIP.readProfile();step=Math.max(1,step-1);paint()};GRIP.q('#finish').onclick=()=>{GRIP.readProfile();GRIP.toast('Je situatie is bewaard');setTimeout(()=>location.href='/geldplan/',400)};paint();</script></body></html>
