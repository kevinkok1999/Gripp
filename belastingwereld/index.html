<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Belastingwereld</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>GRIP.shell('/belastingwereld/','Belastingwereld','Vergelijk landen alleen als startpunt. Waar je werkelijk belasting betaalt hangt af van fiscale woonplaats, inkomen, gezin, sociale premies en lokale regels.',`<div class="layout2"><section class="panel"><h2>Voorbeeldvergelijking</h2><p class="muted">De OECD rapporteert voor 2025 netto gemiddelde persoonlijke belastingdruk voor een alleenstaande werknemer op gemiddeld loon. Dit is géén ranglijst voor emigratie en zegt niets over jouw persoonlijke situatie.</p><div class="list"><div class="row"><div><small>OECD-indicator</small><b>Mexico</b></div><strong>13,2%</strong></div><div class="row"><div><small>OECD-indicator</small><b>Costa Rica</b></div><strong>9,8%</strong></div><div class="row"><div><small>OECD-indicator</small><b>Chili</b></div><strong>7,1%</strong></div><div class="row"><div><small>OECD-indicator</small><b>Colombia</b></div><strong>0,0%</strong></div></div></section><aside class="stack"><section class="actionBox"><small>Niet alleen naar percentages kijken</small><h3>Woonplaatsregels zijn bepalend</h3><p>Een laag tarief betekent niet automatisch dat jij daar minder belasting betaalt. Belastbare basis, premies, verblijf en verdragen tellen mee.</p></section><section class="panel"><h3>Gebruik GRIP hiervoor</h3><p class="muted">Zie dit als een onderzoeksstartpunt. Voor echte verhuis- of fiscale beslissingen hoort een lokale belastingadviseur of officiële bron erbij.</p><a class="btn secondary" href="https://www.oecd.org/en/topics/sub-issues/taxing-wages.html" target="_blank" rel="noopener">Open OECD bron</a></section></aside></div>`);</script></body></html>
