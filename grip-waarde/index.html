<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Waarde</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load();GRIP.shell('/grip-waarde/','Wat heeft GRIP je echt opgeleverd?','Niet schermtijd of badges, maar euro’s gevonden, bespaard of beter voorbereid.',`<div class="layout2"><section class="panel"><h2>Voeg resultaat toe</h2><div class="field"><label>Wat is gelukt?</label><div class="input"><input id="vn" placeholder="Bijv. abonnement opgezegd"></div></div><div class="formGrid"><div class="field"><label>Waarde</label><div class="input"><span>€</span><input id="va" type="number"></div></div><div class="field"><label>Type</label><div class="input"><select id="vt"><option>Bespaard</option><option>Gevonden</option><option>Teruggekregen</option><option>Voorbereid</option></select></div></div></div><button class="btn primary" id="add">Resultaat toevoegen</button></section><section class="panel"><h2>Jouw GRIP Waarde</h2><div class="big" id="total"></div><p class="muted">Totaal van wat je zelf hebt vastgelegd.</p><div id="rows" class="list"></div></section></div>`);const render=()=>{GRIP.q('#total').textContent=GRIP.money(d.value.reduce((s,x)=>s+GRIP.num(x.amount),0));GRIP.q('#rows').innerHTML=d.value.length?d.value.map(x=>`<div class="row"><div><small>${GRIP.esc(x.type)}</small><b>${GRIP.esc(x.name)}</b></div><strong>${GRIP.money(x.amount)}</strong></div>`).join(''):'<div class="notice good">Nog niets toegevoegd. Een kleine besparing telt ook.</div>'};GRIP.q('#add').onclick=()=>{const name=GRIP.q('#vn').value.trim(),amount=GRIP.num(GRIP.q('#va').value),type=GRIP.q('#vt').value;if(!name||!amount)return GRIP.toast('Vul resultaat en bedrag in');d.value.push({id:GRIP.uid(),name,amount,type});GRIP.save();render();GRIP.toast('Resultaat toegevoegd')};render();</script></body></html>
