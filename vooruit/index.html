<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIP Vooruit</title><link rel="stylesheet" href="/style.css"></head><body><script src="/common.js"></script><script>const d=GRIP.load(),c=GRIP.calc(),p=d.profile;const points=[1,3,6,12].map(m=>{const due=d.bills.filter(b=>b.due&&GRIP.monthsUntil(b.due)<=m).reduce((s,b)=>s+GRIP.num(b.amount),0);const v=GRIP.num(p.buffer)+(c.income-c.costs-GRIP.num(p.monthlySaving))*m-due;return[m,v,due]});GRIP.shell('/vooruit/','Zie wat eraan komt','Niet om de toekomst perfect te voorspellen, maar om verrassingen eerder te zien en rustiger te kunnen bijsturen.',`<div class="layout2"><section class="panel"><h2>1, 3, 6 en 12 maanden vooruit</h2><div class="timeline">${points.map(([m,v,due])=>`<article class="time"><small class="muted">OVER ${m} ${m===1?'MAAND':'MAANDEN'}</small><h3>${GRIP.money(v)}</h3><p class="muted">${due?GRIP.money(due)+' aan ingevoerde rekeningen meegenomen.':'Geen ingevoerde rekening in deze periode.'}</p></article>`).join('')}</div></section><aside class="stack"><section class="actionBox"><small>Wat ziet GRIP?</small><h3>${points.some(x=>x[1]<0)?'Er ontstaat ergens een tekort':'Je projectie blijft boven nul'}</h3><p>${points.some(x=>x[1]<0)?'Open Rekeningen en Geldplan om te kijken welke kosten je eerder kunt opvangen.':'Dit is een schatting op basis van je huidige invoer, geen garantie.'}</p></section><section class="panel"><h3>Maak de vooruitblik beter</h3><p class="muted">Hoe meer jaarlijkse rekeningen je toevoegt, hoe minder onverwachte kosten buiten beeld blijven.</p><a class="btn secondary" href="/rekeningen/">Rekeningen toevoegen</a></section></aside></div>`);</script></body></html>
